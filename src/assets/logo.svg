<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" width="256" height="256" role="img" aria-label="Tilla.fx logo">
  <defs>
    <linearGradient id="tf-bg" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="tf-gold" x1="0" y1="6" x2="0" y2="33" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fef3c7"/>
      <stop offset="0.45" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="tf-silver" x1="0" y1="7" x2="0" y2="34" gradientUnits="userSpaceOnUse">
      <stop stop-color="#cbd5e1"/>
      <stop offset="0.55" stop-color="#94a3b8"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
  </defs>

  <!-- fon -->
  <rect width="40" height="40" rx="11" fill="url(#tf-bg)"/>
  <rect x="0.5" y="0.5" width="39" height="39" rx="10.5" fill="none" stroke="#fbbf24" stroke-opacity="0.25"/>

  <!-- O'NG: oltin strelka yuqoriga = o'sish (shamchiq tanali) -->
  <g>
    <polygon points="27,7 32.5,15 21.5,15" fill="url(#tf-gold)" stroke="url(#tf-gold)" stroke-width="1.2" stroke-linejoin="round"/>
    <line x1="27" y1="15" x2="27" y2="32" stroke="url(#tf-gold)" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="24.8" y="19" width="4.4" height="9" rx="1.1" fill="url(#tf-gold)"/>
  </g>

  <!-- CHAP: kumush strelka pastga = tushish (180° aylantirilgan) -->
  <g>
    <polygon points="13,33 7.5,25 18.5,25" fill="url(#tf-silver)" stroke="url(#tf-silver)" stroke-width="1.2" stroke-linejoin="round"/>
    <line x1="13" y1="25" x2="13" y2="8" stroke="url(#tf-silver)" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="10.8" y="12" width="4.4" height="9" rx="1.1" fill="url(#tf-silver)"/>
  </g>
</svg>
